<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Candidate Dashboard</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background:#f5f7fb;
font-family:Arial;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-6px);
}

.icon{
font-size:40px;
margin-bottom:10px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">

<span class="navbar-brand">AI Job Portal</span>

<a class="btn btn-outline-light">Logout</a>

</div>
</nav>

<div class="container mt-5">

<h2 class="mb-4">Candidate Dashboard</h2>

<div class="row g-4">

<!-- Upload Resume -->

<div class="col-md-3">

<div class="card text-center p-4">

<div class="icon text-primary">
<i class="fas fa-upload"></i>
</div>

<h5>Upload Resume</h5>

<p>Upload your resume for AI analysis</p>

<a href="upload-resume.html" class="btn btn-primary">
Upload
</a>

</div>

</div>


<!-- Job Listings -->

<div class="col-md-3">

<div class="card text-center p-4">

<div class="icon text-info">
<i class="fas fa-briefcase"></i>
</div>

<h5>Job Listings</h5>

<p>Browse and apply for jobs</p>

<a href="job-listings.html" class="btn btn-info">
View Jobs
</a>

</div>

</div>


<!-- Match Results -->

<div class="col-md-3">

<div class="card text-center p-4">

<div class="icon text-success">
<i class="fas fa-chart-line"></i>
</div>

<h5>Match Results</h5>

<p>Check AI job match score</p>

<a href="match-result.html" class="btn btn-success">
View Matches
</a>

</div>

</div>


<!-- AI Assistant -->

<div class="col-md-3">

<div class="card text-center p-4">

<div class="icon text-warning">
<i class="fas fa-robot"></i>
</div>

<h5>AI Career Assistant</h5>

<p>Get career guidance</p>

<a href="chatbot.html" class="btn btn-warning">
Open Chat
</a>

</div>

</div>

</div>

</div>

</body>
</html>
