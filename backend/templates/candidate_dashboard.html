<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Candidate Dashboard</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #f4f6f9;
    }

    .navbar {
        background: #4facfe;
        color: white;
        padding: 15px;
        display: flex;
        justify-content: space-between;
    }

    .navbar a {
        color: white;
        text-decoration: none;
        margin-left: 15px;
    }

    .container {
        padding: 30px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    button {
        padding: 8px 14px;
        background: #4facfe;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: #00c6ff;
    }

    .job {
        border-bottom: 1px solid #eee;
        padding: 15px 0;
    }

    .score {
        font-weight: bold;
        color: green;
        margin-top: 5px;
    }

    .disabled {
        background: gray;
        cursor: not-allowed;
    }

    .gap-box {
        margin-top: 8px;
        font-size: 14px;
        background: #f9f9f9;
        padding: 8px;
        border-radius: 6px;
    }
</style>

</head>
<body>

<div class="navbar">
    <h3>Candidate Dashboard</h3>
    <div>
        <a href="#">Profile</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">

<!-- Resume Upload -->
<div class="card">
    <h3>Upload Resume</h3>
    <form id="resumeForm" enctype="multipart/form-data">
        <input type="file" name="resume" required>
        <br><br>
        <button type="submit">Upload & Analyze</button>
    </form>
    <p id="uploadStatus"></p>
</div>

<!-- Job Listings -->
<div class="card">
    <h3>Available Jobs</h3>
    <div id="jobsList">Loading jobs...</div>
</div>

</div>

<script>

// -------- Upload Resume --------
document.getElementById("resumeForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    let formData = new FormData(this);
    let status = document.getElementById("uploadStatus");

    try {
        let res = await fetch("/upload-resume", {
            method: "POST",
            body: formData,
            credentials: "include"
        });

        let data = await res.json();
        console.log("UPLOAD RESPONSE:", data);

        if (res.ok) {
            status.innerText = "✅ Resume uploaded & processed";
        } else {
            status.innerText = "❌ " + (data.error || "Upload failed");
        }

    } catch (err) {
        status.innerText = "❌ Upload failed";
        console.error(err);
    }
});


// -------- Load Jobs --------
async function loadJobs() {
    try {
        let res = await fetch("/get-jobs", {
            credentials: "include"
        });

        let jobs = await res.json();
        console.log("JOBS:", jobs);

        let container = document.getElementById("jobsList");
        container.innerHTML = "";

        jobs.forEach(job => {
            let div = document.createElement("div");
            div.classList.add("job");

            div.innerHTML = `
                <h4>${job.title}</h4>
                <p>${job.description}</p>
                <p><b>Skills:</b> ${job.required_skills || "Not specified"}</p>
                <p><b>Experience:</b> ${job.experience_required || "N/A"}</p>
                <p><b>Location:</b> ${job.location || "N/A"}</p>

                <button onclick="applyJob('${job.job_id}', this)">Apply</button>

                <p class="score" id="score-${job.job_id}"></p>
                <div id="gap-${job.job_id}" class="gap-box"></div>
            `;

            container.appendChild(div);
        });

    } catch (err) {
        console.error("Error loading jobs:", err);
    }
}


// -------- Apply Job --------
async function applyJob(jobId, btn) {
    btn.innerText = "Applying...";
    btn.disabled = true;

    try {
        let res = await fetch("/apply-job", {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ job_id: jobId })
        });

        let data = await res.json();
        console.log("APPLY RESPONSE:", data);

        if (res.ok) {

            // -------- MATCH SCORE --------
            let score = (data.match_score || 0).toFixed(2);
            document.getElementById(`score-${jobId}`).innerText =
                "Match Score: " + score + "%";

            // -------- GAP + EXPLANATION --------
            let gapDiv = document.getElementById(`gap-${jobId}`);

            let matched = (data.matched_skills || []).join(", ");
            let missing = (data.missing_skills || []).join(", ");
            let gap = data.skill_gap_percentage || 0;

            let color = gap < 30 ? "green" : gap < 60 ? "orange" : "red";

            gapDiv.innerHTML = `
                <p><b>🤖 AI Analysis:</b> ${data.explanation || "N/A"}</p>

                <p><b>📊 Skill Gap:</b> 
                    <span style="color:${color}; font-weight:bold;">
                        ${gap}%
                    </span>
                </p>

                <p><b>✅ Matched Skills:</b> ${matched || "None"}</p>
                <p><b>❌ Missing Skills:</b> ${missing || "None"}</p>
            `;

            btn.innerText = "Applied";
            btn.classList.add("disabled");

        } else {
            btn.innerText = "Apply";
            btn.disabled = false;
            alert(data.error || "Failed to apply");
        }

    } catch (err) {
        console.error("Apply error:", err);
        btn.innerText = "Apply";
        btn.disabled = false;
    }
}
// Load jobs
loadJobs();

</script>

</body>
</html>
