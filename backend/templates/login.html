<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Job Portal</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #43e97b, #38f9d7);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }


    .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        width: 350px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 6px;
        border: 1px solid #ccc;
        outline: none;
    }

    input:focus {
        border-color: #43e97b;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #43e97b;
        border: none;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
        font-size: 16px;
    }

    button:hover {
        background: #2ecc71;
    }

    .link {
        text-align: center;
        margin-top: 10px;
    }

    .link a {
        text-decoration: none;
        color: #43e97b;
    }
</style>


</head>
<body>

<div class="container">
    <h2>Login</h2>


<form action="/login" method="POST">
    <input type="email" name="email" placeholder="Email" required>
    
    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Login</button>
</form>

<div class="link">
    Don't have an account? <a href="/register">Register</a>
</div>


</div>

</body>
</html>
